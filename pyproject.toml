[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai8x-synthesis"
version = "0.1.0"
description = "ADI's compiler for MAX78000 AI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Analog Devices Inc."}
]
dependencies = [
    "numpy",
    "onnx",
    "torch",
]

[project.urls]
Homepage = "https://github.com/analogdevicesinc/MaximAI_Documentation"
Documentation = "https://github.com/analogdevicesinc/ai8x-synthesis/blob/develop/README.md"
Repository = "https://github.com/analogdevicesinc/ai8x-synthesis.git"
Issues = "https://github.com/analogdevicesinc/ai8x-synthesis/issues"

[project.scripts]
izer = "izer.izer:main"

[tool.black]
line-length = 99

[tool.codespell]
count = ""
ignore-words-list = "nervana,cconfiguration,anormal"
quiet-level = 3
skip = "*.dasm,*.map,*.pdf,./rtldev,./.mypy_cache,./sdk,./.venv,./.git,./super-linter.log,./pyproject.toml"
ignore-regex = '^\s+"image/png".*$'

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".venv",
    "assets",
    "attic",
    "bin",
    "etc",
    "docs",
    "lib",
    "networks",
    "rtldev",
    "sdk",
    "share",
    "trained",
]

[tool.isort]
profile = ""
line_length = 99
known_math = [
    "numpy",
    "torch",
    "torchvision",
    "torchaudio",
    "tensorboard",
    "tensorflow",
]
sections = [
    "FUTURE",
    "STDLIB",
    "MATH",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
show_column_numbers = true

[tool.pylint."MESSAGES CONTROL"]
disable = "invalid-name,consider-using-with,duplicate-code,not-callable"
[tool.pylint.TYPECHECK]
ignored-modules = "numpy,matplotlib.cm,torch"
ignored-classes = "ModelProto"
[tool.pylint.FORMAT]
max-line-length = 99
[tool.pylint.DESIGN]
max-locals = 100
max-statements = 2000
min-public-methods = 0
max-branches = 180
max-module-lines = 5000
max-nested-blocks = 10
max-args = 55
max-attributes = 60
max-public-methods = 35
max-bool-expr = 12
max-parents = 15
[tool.pylint.MASTER]
ignore = "CMSIS_5,sdk"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["izer"]

